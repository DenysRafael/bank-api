spring.application.name=bank-api

# Usa variáveis de ambiente do Render se existirem; senão cai no Postgres local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bankuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bankpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}